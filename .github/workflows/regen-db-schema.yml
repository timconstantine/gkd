name: Regen-DB-Schema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # Running the jvmTest task both regenerates gkd-db/schemas/ (Room's
      # room3.schemaDirectory export, wired into the kspJvm task as a
      # compilation dependency) and validates AppDbMigrationTest against it.
      - run: ./gradlew :gkd-db:jvmTest

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gkd-db/schemas
          if git diff --cached --quiet; then
            echo "No schema changes to commit"
          else
            git commit -m "chore: regenerate Room schema export (gkd-db/schemas)"
            git push
          fi
