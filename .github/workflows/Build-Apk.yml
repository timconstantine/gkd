name: Build-Apk

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # Builds an unsigned-release-equivalent debug APK (signed with the
      # auto-generated Android debug keystore) as the default build, since
      # this repo does not have the GKD_STORE_FILE_BASE64 / GKD_STORE_PASSWORD
      # / GKD_KEY_ALIAS / GKD_KEY_PASSWORD release-signing secrets configured.
      # Switch this back to `assembleGkdRelease` (and restore the "write gkd
      # keystore" step removed here) once those secrets are set.
      - run: ./gradlew :gkd-app:assembleGkdDebug
        env:
          GKD_RENAME_APK_FLAG: "1"

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: gkd-app/build/outputs/apk/gkd/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: gkd-app/build/outputs
